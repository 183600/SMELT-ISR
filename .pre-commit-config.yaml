# 本地质量门。CI（.github/workflows/tests.yml）只跑 pytest；
# 静态检查在这里执行。顶层 exclude 保证任何 hook 都不会改动
# .github/ 下的 CI 配置。
exclude: '^\.github/'

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix, --force-exclude]
      - id: ruff-format
        # ruff-format 会重排 exec 组合的机械拆分文件（exp/part_*.py、
        # exp/mainflow/、exp/analysisflow/、selfcheck/checks_*.py 及两个
        # 生成式 manifest）的既有排版，产生与语义无关的巨量 diff；与
        # [tool.ruff] extend-exclude / [tool.mypy] exclude 的范围保持
        # 一致，格式化只作用于手写文件。
        exclude: '^(exp/part_.+\.py|exp/mainflow/.+\.py|exp/analysisflow/.+\.py|selfcheck/checks_.+\.py)$'
        args: [--force-exclude]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies: []
        args: [--config-file=pyproject.toml]
        # mypy 的 exclude 只影响递归发现；pre-commit 显式传参时会
        # 绕过它，因此这里只传 mypy 配置实际覆盖的手写文件。
        files: '^(experiment\.py|tests/.*\.py|selfcheck/(__init__|_manifest)\.py|exp/(__init__|_manifest|_runner)\.py)$'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        # 只处理 JSON/YAML；Markdown（README*.md、docs/、算力申请.md）
        # 是中文手写文档，交给 prettier 会重排列表/表格并引入无关 diff。
        types: [json, yaml]

  # 黑白名单说明：此前同时启用 black 与 ruff-format 两个格式化器，
  # 输出互不兼容、会互相覆盖；本仓库的格式化工具是 ruff-format
  # （配置见 [tool.ruff]），black 已移除。
