name: Continuous Loop

on:
  workflow_dispatch:
  # 每 15 分钟一次「心跳」：配合下方 concurrency 排队，任何时刻最多 1 个 running + 1 个 pending。
  # 当前 run 无论以何种方式结束（成功/失败/被取消/runner 意外宕机——宕机时连
  # if: always() 步骤都会被 GitHub 跳过，self-dispatch 无法执行），
  # 队列中的下一个 run 都会在几秒内开始，心跳也能在 ≤15 分钟内补位，链条永不断。
  schedule:
    - cron: '*/15 * * * *'

# ⭐ 关键 1：同一时间只允许一个 run，新的排队等待（不取消旧的）
# 上一个 run 一结束，队列里的下一个立刻开始 → "上一个结束立刻触发下一个"
concurrency:
  group: continuous-loop
  cancel-in-progress: false

# ⭐ 关键 2：全局环境从源头防日志乱码
#   - LANG/LC_ALL=C.UTF-8        强制 UTF-8 locale，中文输出不会变问号/乱码
#   - NO_COLOR/FORCE_COLOR/TERM  让 opencode / npm / gh 等关闭颜色与 TUI 动画
#   - PYTHONIOENCODING/PYTHONUTF8  子进程里的 Python 一律 UTF-8
env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  NO_COLOR: '1'
  FORCE_COLOR: '0'
  TERM: dumb
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'
  # 冻结开关：确认性实验期间设为 true（或创建 .github/EXPERIMENT_FREEZE），
  # 工作流只保留续跑/清理，不再让 agent 修改代码或提交实验结果。
  EXPERIMENT_FREEZE: ${{ vars.EXPERIMENT_FREEZE }}

jobs:
  run-opencode:
    runs-on: ubuntu-latest
    # ⭐ 关键 3：硬超时 200 分钟（GitHub 单 job 上限 360 分钟）。
    # 实际时长由「Run opencode loop」里的工作窗口控制：约 2h50m 的连续工作
    # + 前置安装约 5 分钟 + 收尾约 3 分钟 → 单次 job 约 3 小时。
    timeout-minutes: 200
    permissions:
      contents: write
      actions: write   # gh workflow run 需要

    steps:
      # ⭐ 立刻续跑（上）：本 run 一开始就把「下一个 run」排进 concurrency 队列。
      # concurrency.cancel-in-progress=false → 组内 1 running + 1 pending，
      # 本 run 无论以何种方式结束（成功 / 失败 / 超时被取消 / runner 宕机），
      # 队列里的后继 run 都会在几秒内自动开始；不依赖任何收尾步骤是否被执行。
      - name: Queue next run (immediate hand-off)
        if: always() && vars.EXPERIMENT_FREEZE != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          BRANCH="${GITHUB_REF_NAME}"
          WF_REF="${GITHUB_WORKFLOW_REF%%@*}"
          WF_FILE="${WF_REF##*/}"
          case "$WF_FILE" in
            *.yml|*.yaml) ;;
            *) WF_FILE="continuous-loop.yml" ;;
          esac
          echo "[loop] repo=${GH_REPO} workflow=${WF_FILE} branch=${BRANCH} run=${RUN_ID}"
          # 组内是否已有「另一个」排队中的 run（排除当前 run 自己：
          # 它刚启动时 API 状态可能还是 pending，不能当成后继）
          pending_other() {
            gh api "repos/${GH_REPO}/actions/workflows/${WF_FILE}/runs?per_page=30" \
              --jq '[.workflow_runs[] | select((.id|tostring) != "'"${RUN_ID}"'") | select(.status=="pending" or .status=="queued" or .status=="waiting" or .status=="requested")] | length' \
              2>/dev/null
          }
          Q="$(pending_other)"
          # 查询失败时按 0 处理：宁可多派一个（会被队列合并），也绝不能漏派而断链
          case "$Q" in ''|*[!0-9]*) Q=0 ;; esac
          echo "[loop] queued successors before dispatch: ${Q}"
          if [ "$Q" != "0" ]; then
            echo "[loop] 后继 run 已在队列中，无需重复派发"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            if gh workflow run "$WF_FILE" --ref "$BRANCH"; then
              for _ in 1 2 3 4 5 6; do
                sleep 5
                Q="$(pending_other)"
                case "$Q" in ''|*[!0-9]*) Q=0 ;; esac
                if [ "$Q" != "0" ]; then
                  echo "[loop] 后继 run 已排队（attempt ${attempt}）——当前 run 一结束它就会立刻起跑"
                  exit 0
                fi
              done
              echo "[loop][warn] 派发已提交但暂未看到排队的 run（attempt ${attempt}）"
            else
              echo "[loop][warn] 派发失败（attempt ${attempt}）"
            fi
            sleep 10
          done
          echo "[loop][warn] 未能确认后继 run；收尾的 next-run job 与 */15 心跳会补位"
          exit 0

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check experiment freeze switch
        id: freeze
        run: |
          set +e
          FROZEN="false"
          if [ "${EXPERIMENT_FREEZE}" = "true" ] || [ "${EXPERIMENT_FREEZE}" = "1" ]; then
            FROZEN="true"
          fi
          if [ -f .github/EXPERIMENT_FREEZE ] || [ -f EXPERIMENT_FREEZE ]; then
            FROZEN="true"
          fi
          echo "frozen=${FROZEN}" >> "$GITHUB_OUTPUT"
          if [ "$FROZEN" = "true" ]; then
            echo "[freeze] 实验冻结中：跳过 agent 阶段，不修改代码/不产生新提交。"
            echo "[freeze] 冻结提交：$(git rev-parse HEAD)"
          fi

      - name: Free up disk space (keep miniconda)
        run: |
          set +e
          echo "=== disk before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet \
                      /usr/share/swift \
                      /usr/local/lib/android \
                      /usr/local/share/boost \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean
          echo "=== disk after cleanup ==="
          df -h /

      - name: Setup Python (pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # npm 全局包缓存：本仓库没有 package-lock.json，无法用 setup-node 的 `cache: npm`
      # （它要求 lock 文件存在），因此直接缓存 ~/.npm，`npm i -g` 会复用其中的 tarball。
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
          key: ${{ runner.os }}-npm-smelt-isr-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-npm-smelt-isr-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure swap (safe version)
        run: |
          set -e
          echo "=== Before ==="
          free -h
          df -h /

          sudo systemctl disable --now systemd-oomd.socket systemd-oomd.service 2>/dev/null || true

          sudo modprobe zram 2>/dev/null || true
          if [ -e /dev/zram0 ]; then
            sudo swapoff /dev/zram0 2>/dev/null || true
            echo 8G | sudo tee /sys/block/zram0/disksize >/dev/null || true
            sudo mkswap /dev/zram0 >/dev/null 2>&1 || true
            sudo swapon -p 100 /dev/zram0 2>/dev/null && echo "[ok] zram enabled (8G, prio=100)" \
              || echo "[warn] zram enable failed"
          else
            echo "[info] zram not available, skip"
          fi

          AVAIL_KB=$(df --output=avail / | tail -1)
          AVAIL_MB=$((AVAIL_KB / 1024))
          WANT_MB=$((AVAIL_MB - 3072))
          if [ "$WANT_MB" -gt 8192 ]; then WANT_MB=8192; fi
          if [ "$WANT_MB" -lt 2048 ]; then WANT_MB=2048; fi
          echo "[info] available disk: ${AVAIL_MB}MB, will create swapfile: ${WANT_MB}MB"

          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          if ! sudo fallocate -l "${WANT_MB}M" /swapfile 2>/dev/null; then
            echo "[info] fallocate failed, falling back to dd"
            sudo dd if=/dev/zero of=/swapfile bs=1M count=$WANT_MB status=none
          fi
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon -p 10 /swapfile && echo "[ok] swapfile enabled"

          sudo sysctl -w vm.swappiness=100
          sudo sysctl -w vm.vfs_cache_pressure=200
          sudo sysctl -w vm.overcommit_memory=1
          sudo sysctl -w vm.dirty_ratio=40
          sudo sysctl -w vm.dirty_background_ratio=10
          sudo sysctl -w vm.watermark_scale_factor=200 2>/dev/null || true

          echo "=== After ==="
          free -h
          swapon --show
          df -h /

      - name: Install Python test deps (cached)
        run: |
          set +e
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            || echo "[warn] requirements-ci.txt 安装失败，跳过（不影响后续步骤）"

      - name: Install DeepSeek Harness (dsh)
        run: |
          npm i -g @deepseek-ai/dsh@0.2.1-rc.2
          dsh --version

      - name: Configure dsh (DeepSeek official API)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -e
          [ -n "$DEEPSEEK_API_KEY" ] || { echo "[error] secrets.DEEPSEEK_API_KEY 未配置" >&2; exit 1; }
          echo "[info] dsh $(dsh --version) | provider=deepseek-official | model=deepseek-flash"

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 中文内容防乱码：提交一律 UTF-8，路径不做八进制转义显示
          git config i18n.commitEncoding utf-8
          git config core.quotepath false

      - name: Run dsh for ~3 hours (phases per iteration)
        if: steps.freeze.outputs.frozen != 'true'
        timeout-minutes: 180
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set +e
          set -o pipefail
          BRANCH="${GITHUB_REF_NAME:-main}"
          OUT=/tmp/oc_out.log
          # 单次 run 的硬预算：3 小时（step 上限 180 分钟，job 上限 200 分钟，
          # 这里留 10 分钟给收尾的清理 / 最终提交 / 推送）
          RUN_HOURS=3
          DEADLINE=$(( $(date +%s) + RUN_HOURS*3600 - 600 ))

          # ================= 五阶段提示词 =================
          PROMPT_PERF='优化代码的性能和显存占用，不要输出或写入"优化了哪些内容"的报告。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样绝对不能删除或移动。'
          PROMPT_BUG='仔细检查代码中是否存在bug，如果有就修改代码。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样绝对不能删除或移动。'

          # ================= 科研方法改进阶段（sci）：提示词池，每次运行时随机选一个 =================
          # SCI_1 为通用提示词：只要求改进科研方法，不指定改进哪一方面；
          # SCI_2~SCI_6 各自只聚焦一个方面：实验设计与准备 / 数据处理 / 可复现性与工程规范 / 对比实验与消融 / 结果分析。
          PROMPT_SCI_1='改进这个项目的科研方法。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样绝对不能删除或移动。'
          PROMPT_SCI_2='从实验设计与准备的角度改进这个项目的科研方法。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样绝对不能删除或移动。'
          PROMPT_SCI_3='从数据处理的角度改进这个项目的科研方法。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样绝对不能删除或移动。'
          PROMPT_SCI_4='从可复现性与工程规范的角度改进这个项目的科研方法。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样绝对不能删除或移动。'
          PROMPT_SCI_5='从对比实验与消融的角度改进这个项目的科研方法。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样绝对不能删除或移动。'
          PROMPT_SCI_6='从结果分析的角度改进这个项目的科研方法。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样绝对不能删除或移动。'
          PROMPT_SINGLE='确保需要是单因素实验的实验都是单因素实验。另外，.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样绝对不能删除或移动。'
          PROMPT_CLEAN='不要修改算力申请.md；不要删除实验结果、审计记录、性能/预算/修复记录或 docs 下的分析文档——这些是审计链的一部分，必须保留或归档到外部不可变存储。只清理临时文件（*.tmp、opencode 临时配置、agent 自己生成的临时清单），不要用删除来“清理”历史记录。注意：.github 目录是 CI 配置，必须原样保留，绝对不能删除、修改或移动其中任何文件，它不属于“多余的内容”；README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README） 是项目说明文档，同样必须原样保留，绝对不能删除或移动，也不属于“多余的内容”。'
          PROMPT_APPLY='确保算力申请.md没有错误。不要删除或移动 README*.md（含 README_zh.md、README_en.md 等所有语言版本的 README）；.github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件。'

          # 每阶段单次调用的最大时长（秒）
          PERF_TIMEOUT=$((3*3600))     # 3h
          BUG_TIMEOUT=$((3*3600))      # 3h
          SCI_TIMEOUT=$((3*3600))      # 3h
          SINGLE_TIMEOUT=$((3600))     # 1h（单因素实验检查）
          CLEAN_TIMEOUT=$((3*3600))    # 3h
          APPLY_TIMEOUT=$((3*3600))    # 3h

          # ================= 模型策略：独立双家族（失效只在家族内级联，不跨家族） =================
          # NVIDIA 家族：glm-5.3 → glm-5.3-flash —— glm-5.3 探测不到或调用失败
          #             自动降级 glm-5.3-flash（https://integrate.api.nvidia.com/v1，
          #             需要仓库 secret NVIDIA_API_KEY）。
          # opencode 家族：opencode 自带的免费 deepseek（Zen 网关
          #             deepseek-v4.1-flash-free，客户端内免鉴权，支持 tool call 与
          #             reasoning effort）→ big-pickle。
          # 候选顺序由 detect_provider 在 run 开始时按 NVIDIA_PROB 掷一次骰子决定，
          # 选定后整个 run 固定（不再逐阶段探测/切换）。
          # harness 固定为 DeepSeek Harness（dsh）：所有阶段一律通过 `dsh --profile headless ...` 调用。
          # 实测：连续 13/13 个 NVIDIA 阶段全部被阶段预算杀掉，一次都没在预算内返回；
          # 单个工具调用延迟约 121s，5 分钟只走 2~3 步；历史提交里 NVIDIA 只占约 4%。
          # 默认关闭，需要时再打开。
          NVIDIA_PROB=0
          FREE_MODEL="opencode/deepseek-v4.1-flash-free"
          # opencode 家族内兜底：免费 deepseek 不可用（限流/下线/调用失败）时，
          #           切换同为 Zen 网关免费的 big-pickle（Big Pickle）。
          PICKLE_MODEL="opencode/big-pickle"
          NVIDIA_MODEL=""
          NVIDIA_FLASH_MODEL=""
          CURRENT_PROVIDER=""
          BROKEN_PROVIDERS=""
          # 本次 run 内选定的模型（探测只在 run 开始时做一次，见 detect_provider）
          SELECTED_MODEL=""
          SELECTED_PROVIDER=""

          mark_broken() {
            case ",$BROKEN_PROVIDERS," in *",$1,"*) ;; *) BROKEN_PROVIDERS="$BROKEN_PROVIDERS${BROKEN_PROVIDERS:+,}$1" ;; esac
          }
          is_broken() {
            case ",$BROKEN_PROVIDERS," in *",$1,"*) return 0 ;; *) return 1 ;; esac
          }

          # ---------- NVIDIA GLM 探测（NVIDIA 家族内两级：glm-5.3 → glm-5.3-flash） ----------
          # 用法: probe_nvidia.py <primary|flash> —— primary 探测 glm-5.3（非 flash 版，
          # 目录中不存在时输出 NOMODEL，由调用方在 NVIDIA 家族内降级 flash）；
          # flash 探测 glm-5.3-flash。探测成功分别把 provider 配置写入
          # opencode.nvidia.json / opencode.nvidia-flash.json
          # （可选合并 $2 指定的基准配置，保留其中已有字段，如权限锁定）。
          cat > /tmp/probe_nvidia.py <<'PYEOF'
          import json, os, sys, urllib.request

          def emit(status, model=''):
              print((status + ' ' + model).strip())
              sys.exit(0)

          def norm(s):
              return s.lower().replace('.', '-').replace('_', '-')

          mode = sys.argv[1] if len(sys.argv) > 1 else 'primary'

          key = os.environ.get('NVIDIA_API_KEY', '').strip()
          if not key:
              emit('DOWN')
          try:
              req = urllib.request.Request(
                  'https://integrate.api.nvidia.com/v1/models',
                  headers={'Authorization': 'Bearer ' + key})
              with urllib.request.urlopen(req, timeout=20) as r:
                  d = json.load(r)
          except Exception:
              emit('DOWN')

          ids = [m.get('id', '') for m in (d.get('data') or []) if m.get('id')]

          def pick(cands, target):
              if not cands:
                  return ''
              def keyf(x):
                  return (0 if norm(x.rsplit('/', 1)[-1]) == target else 1, len(x))
              return sorted(cands, key=keyf)[0]

          if mode == 'flash':
              mid = pick([i for i in ids if 'glm-5-3' in norm(i) and 'flash' in norm(i)], 'glm-5-3-flash')
          else:
              mid = pick([i for i in ids if 'glm-5-3' in norm(i) and 'flash' not in norm(i)], 'glm-5-3')
          if not mid:
              emit('NOMODEL')

          cfg = {}
          base = sys.argv[2] if len(sys.argv) > 2 else ''
          if base and os.path.exists(base):
              try:
                  with open(base) as f:
                      cfg = json.load(f)
              except Exception:
                  cfg = {}
          cfg['$schema'] = 'https://opencode.ai/config.json'
          cfg.setdefault('provider', {})
          cfg['provider']['nvidia'] = {
              'npm': '@ai-sdk/openai-compatible',
              'name': 'NVIDIA',
              'options': {
                  'baseURL': 'https://integrate.api.nvidia.com/v1',
                  'apiKey': '{env:NVIDIA_API_KEY}',
              },
              'models': {mid: {'name': mid}},
          }
          cfg['model'] = 'nvidia/' + mid
          cfg_path = os.path.expanduser(
              '~/.config/opencode/opencode.nvidia-flash.json' if mode == 'flash'
              else '~/.config/opencode/opencode.nvidia.json')
          try:
              os.makedirs(os.path.dirname(cfg_path), exist_ok=True)
              with open(cfg_path, 'w') as f:
                  json.dump(cfg, f, indent=2, ensure_ascii=False)
          except Exception:
              pass
          emit('OK', mid)
          PYEOF

          probe_nvidia() {
            # $1: primary|flash —— 分别探测 glm-5.3 / glm-5.3-flash
            local out st mid
            out="$(python3 /tmp/probe_nvidia.py "$1" 2>/dev/null)" || out="DOWN"
            st="${out%% *}"; mid="${out#* }"
            if [ "$st" = "OK" ] && [ "$mid" != "$out" ] && [ -n "$mid" ]; then
              if [ "$1" = "flash" ]; then NVIDIA_FLASH_MODEL="$mid"; else NVIDIA_MODEL="$mid"; fi
              return 0
            fi
            if [ "$1" = "flash" ]; then NVIDIA_FLASH_MODEL=""; else NVIDIA_MODEL=""; fi
            return 1
          }

          # ---------- 切换 provider（每次调用都重写/清理配置，防 agent 篡改） ----------
          switch_provider() {
            case "$1" in
              free|pickle)
                rm -f "$HOME/.config/opencode/opencode.json" \
                      "$HOME/.config/opencode/opencode.jsonc" \
                      "$HOME/.config/opencode/config.json" 2>/dev/null
                ;;
              nvidia)
                cp -f "$HOME/.config/opencode/opencode.nvidia.json" \
                      "$HOME/.config/opencode/opencode.json" 2>/dev/null || true
                ;;
              nvidia_flash)
                cp -f "$HOME/.config/opencode/opencode.nvidia-flash.json" \
                      "$HOME/.config/opencode/opencode.json" 2>/dev/null || true
                ;;
            esac
            CURRENT_PROVIDER="$1"
          }

          # ---------- 一次性模型探测（每个 run 只做一次） ----------
          # run 开始时探测一次，选定 SELECTED_MODEL；之后所有阶段直接
          #   dsh --profile headless "$prompt"
          # 只有收到 429 / 5xx / 连接失败 / 非零退出时，才重新探测并跳过已判定失效的候选。
          # 候选顺序：按 NVIDIA_PROB 掷一次骰子决定 NVIDIA 家族是否优先，否则 opencode 家族优先。
          # 注意：只看模型目录不够——必须真跑一次冒烟调用，否则会选中“连得上但永远跑不完”的
          # 端点（实测 NVIDIA glm-5.3 单步 121s，13/13 个阶段全部被预算杀掉）。
          smoke_test() {
            local m="$1" extra=""
            case "$m" in "$FREE_MODEL") [ -n "$VARIANT" ] && extra="--variant $VARIANT" ;; esac
            # shellcheck disable=SC2086
            timeout --kill-after=30 120 dsh --profile headless "只回复两个字：OK" > /tmp/smoke_test.log 2>&1
          }

          detect_provider() {
            local pass cand model order
            for pass in 1 2; do
              if [ "$NVIDIA_PROB" -gt 0 ] && [ $((RANDOM % 100)) -lt "$NVIDIA_PROB" ]; then
                order="nvidia nvidia_flash free pickle"
              else
                order="free pickle nvidia nvidia_flash"
              fi
              for cand in $order; do
                case "$cand" in
                  nvidia|nvidia_flash) [ "$NVIDIA_PROB" -gt 0 ] || continue ;;
                esac
                is_broken "$cand" && continue
                case "$cand" in
                  nvidia)
                    probe_nvidia primary || { mark_broken nvidia; continue; }
                    switch_provider nvidia
                    model="nvidia/$NVIDIA_MODEL"
                    ;;
                  nvidia_flash)
                    probe_nvidia flash || { mark_broken nvidia_flash; continue; }
                    switch_provider nvidia_flash
                    model="nvidia/$NVIDIA_FLASH_MODEL"
                    ;;
                  free)
                    switch_provider free
                    model="$FREE_MODEL"
                    ;;
                  pickle)
                    switch_provider pickle
                    model="$PICKLE_MODEL"
                    ;;
                esac
                if smoke_test "$model"; then
                  SELECTED_MODEL="$model"
                  SELECTED_PROVIDER="$cand"
                  export SELECTED_MODEL
                  echo "[provider] 选定 $model（$cand），本次 run 内固定使用，不再逐阶段探测"
                  return 0
                fi
                echo "[warn] $model 冒烟测试失败/超时，换下一个候选"
                mark_broken "$cand"
              done
              # 第一轮全部失效：清空失效标记再试一轮（可能是瞬时故障）
              [ "$pass" -eq 1 ] && BROKEN_PROVIDERS=""
            done
            SELECTED_MODEL=""
            SELECTED_PROVIDER=""
            return 1
          }

          # ---------- 思考强度（仅免费 deepseek 路径）：有 max 选 max，没有 max 选 high，否则不设置 ----------
          # NVIDIA 家族（glm-5.3 / glm-5.3-flash）走 openai-compatible 端点，不设置思考强度。
          # 先刷新 opencode 的模型目录缓存（models.dev），再解析该模型支持的
          # reasoning effort 档位。检测失败时兜底 max（无效 variant 会被
          # opencode 静默忽略，不会导致调用失败）。
          opencode models opencode --refresh >/dev/null 2>&1 || true
          cat > /tmp/detect_variant.py <<'PYEOF'
          import json, os, sys
          try:
              p = os.path.expanduser('~/.cache/opencode/models.json')
              with open(p) as f:
                  d = json.load(f)
              m = d.get('opencode', {}).get('models', {}).get('deepseek-v4.1-flash-free')
              if m is None:
                  print('UNKNOWN')
                  sys.exit()
              values = []
              for o in (m.get('reasoning_options') or []):
                  values.extend(o.get('values') or [])
              for cand in ('max', 'high'):
                  if cand in values:
                      print(cand)
                      sys.exit()
              print('NONE')
          except Exception:
              print('UNKNOWN')
          PYEOF
          VRESULT=$(python3 /tmp/detect_variant.py 2>/dev/null)
          case "$VRESULT" in
            max|high) VARIANT="$VRESULT" ;;
            NONE)     VARIANT="" ;;
            *)        VARIANT="max" ;;
          esac
          echo "[info] 候选顺序：NVIDIA(glm-5.3→glm-5.3-flash)=${NVIDIA_PROB}% 优先 / opencode(免费deepseek→big-pickle) 优先；免费路径思考强度=${VARIANT:-<不设置>} (detect=$VRESULT)"
          # run 开始时探测一次；失败也不阻塞，run_phase 需要时会再试
          # ================= harness: DeepSeek Harness (dsh) + DeepSeek 官方 API =================
          # 固定 provider=deepseek-official、model=deepseek-flash；API key 从启动环境
          # DEEPSEEK_API_KEY 读取（headless profile 不读 GUI 凭据库）。
          # 本段覆盖下方（或上方）原有的 provider 探测实现：不再探测 NVIDIA / opencode Zen。
          SELECTED_MODEL="deepseek-official/deepseek-flash"
          SELECTED_PROVIDER="deepseek-official"
          CURRENT_MODEL="$SELECTED_MODEL"
          CURRENT_PROVIDER="$SELECTED_PROVIDER"
          pick_model() {
            CURRENT_MODEL="deepseek-official/deepseek-flash"
            CURRENT_PROVIDER="deepseek-official"
            return 0
          }
          pick_provider() {
            CURRENT_MODEL="deepseek-official/deepseek-flash"
            CURRENT_PROVIDER="deepseek-official"
            return 0
          }
          smoke_test() {
            timeout --kill-after=30 180 dsh --profile headless "只回复两个字：OK" > /tmp/smoke_test.log 2>&1
          }
          detect_provider() {
            SELECTED_MODEL="deepseek-official/deepseek-flash"
            SELECTED_PROVIDER="deepseek-official"
            CURRENT_MODEL="$SELECTED_MODEL"
            CURRENT_PROVIDER="$SELECTED_PROVIDER"
            export SELECTED_MODEL SELECTED_PROVIDER
            echo "[provider] 固定使用 $SELECTED_MODEL（DeepSeek 官方 API）"
            if smoke_test; then
              return 0
            fi
            echo "[warn] dsh 冒烟测试失败（API key / 网络 / 配额）"
            return 1
          }
          if detect_provider; then :; else echo "[warn] 启动时未选出可用模型，第一个阶段会再探测一次"; fi

          i=0


          # ================= README.md 防删自愈 =================
          # clean 阶段可能把 README.md 当作“多余内容”删除。
          # 每次提交前校验：一旦被删，立即从 HEAD（其次最近一个包含它的历史版本）恢复；
          # 只防删除，允许正常的内容修改。
          ensure_readme() {
            # 保护所有语言版本的 README（README.md / README_zh.md / README_en.md）。
            # 只防删除；内容修改不受影响。
            for f in README.md README_zh.md README_en.md; do
              [ -f "$f" ] && continue
              if git show "HEAD:$f" > /tmp/readme_restore.md 2>/dev/null && [ -s /tmp/readme_restore.md ]; then
                mv /tmp/readme_restore.md "$f"
                echo "[guard] 检测到 $f 被删除，已从 HEAD 恢复"
                continue
              fi
              F_SHA=$(git log --format=%H --diff-filter=AM -- "$f" 2>/dev/null | head -1)
              if [ -n "$F_SHA" ] && git show "${F_SHA}:$f" > /tmp/readme_restore2.md 2>/dev/null && [ -s /tmp/readme_restore2.md ]; then
                mv /tmp/readme_restore2.md "$f"
                echo "[guard] 检测到 $f 被删除，已从历史版本 ${F_SHA:0:7} 恢复"
              else
                echo "[warn] $f 缺失且找不到可恢复的历史版本"
              fi
            done
          }
          ensure_readme

          # ---------- 提交信息附带本轮实际使用的模型（写入 /tmp/last_model_used.txt） ----------
          MODEL_TAG_FILE=/tmp/last_model_used.txt
          record_model() {
            printf '%s' "$1" > "$MODEL_TAG_FILE" 2>/dev/null || true
          }
          model_tag() {
            local m=""
            [ -f "$MODEL_TAG_FILE" ] && m="$(head -c 120 "$MODEL_TAG_FILE" 2>/dev/null)"
            [ -n "$m" ] && printf ' [model: %s]' "$m"
            return 0
          }

          commit_and_push() {
            # ⭐ 保护循环自身：回滚 AI 对 .github 的改动，防止 workflow 被改坏导致循环中断
            git checkout HEAD -- .github 2>/dev/null || true
            git clean -fdq .github 2>/dev/null || true
            ensure_readme
            rm -f .opencode_issues.md
            git add -A || true
            git commit -m "auto: iteration $1$(model_tag)" || true
            git pull --rebase origin "$BRANCH" || git rebase --abort || true
            git push origin "HEAD:${BRANCH}" || echo "[warn] push $1 failed"
          }

          on_shutdown() {
            echo "[trap] 收到 runner 终止信号，保存未提交的改动..."
            git checkout HEAD -- .github 2>/dev/null || true
            git clean -fdq .github 2>/dev/null || true
            ensure_readme
            rm -f .opencode_issues.md
            git add -A || true
            if ! git diff --cached --quiet; then
              git commit -m "auto: partial work saved on shutdown$(model_tag)" || true
              git pull --rebase origin "$BRANCH" || git rebase --abort || true
              git push origin "HEAD:${BRANCH}" || true
              echo "[trap] partial work committed & pushed"
            else
              echo "[trap] nothing to commit"
            fi
            exit 0
          }
          trap on_shutdown TERM INT

          # ---------- 单阶段执行 ----------
          # 每个 run 只在 detect_provider 里探测一次；这里直接用 SELECTED_MODEL 调用。
          # 参数: phase_name  prompt  timeout_seconds
          # 返回: 0 成功 / 124|137|143 超时被杀（预算耗尽，改动照常提交）/ 1 时间用尽
          run_phase() {
            local phase="$1" prompt="$2" budget="$3"
            local attempt=0
            # 整个阶段（含所有重试）共用的硬上限：重试不得让总时长超过 budget
            local phase_end=$(( $(date +%s) + budget ))

            while :; do
              attempt=$((attempt+1))

              local NOW=$(date +%s)
              if [ "$NOW" -ge "$DEADLINE" ]; then
                echo "[info] phase=$phase 全局时间已用尽，跳过"
                return 1
              fi
              local REMAIN=$(( DEADLINE - NOW ))
              local budget_now=$(( phase_end - NOW ))
              [ "$budget_now" -gt "$REMAIN" ] && budget_now="$REMAIN"
              if [ "$budget_now" -le 60 ]; then
                echo "[info] phase=$phase 剩余时间不足，跳过"
                return 1
              fi

              # 正常路径：run 开始时已选定模型，这里不会发起任何网络探测
              if [ -z "$SELECTED_MODEL" ]; then
                if ! detect_provider; then
                  echo "[warn] phase=$phase 暂时没有可用模型，180s 后重试 (attempt=$attempt)"
                  sleep 180
                  continue
                fi
              fi

              # 防止 agent 写入的 opencode 配置干扰后续调用
              rm -f ./opencode.json ./opencode.jsonc ./.opencode.json 2>/dev/null

              local extra=""
              case "$SELECTED_MODEL" in "$FREE_MODEL") [ -n "$VARIANT" ] && extra="--variant $VARIANT" ;; esac

              record_model "$SELECTED_MODEL"
              echo "=========== iter #$i | phase=$phase | attempt=$attempt | model=$SELECTED_MODEL ==========="
              # shellcheck disable=SC2086
              timeout --kill-after=180 "$budget_now" dsh --profile headless "$prompt" 2>&1 | tee "$OUT"
              local EC=$?

              # 成功
              if [ $EC -eq 0 ]; then
                return 0
              fi

              # 超时 / 被杀：阶段预算耗尽属正常结束，改动照常提交
              if [ $EC -eq 124 ] || [ $EC -eq 137 ] || [ $EC -eq 143 ]; then
                echo "[warn] phase=$phase 超时/被杀 (exit=$EC)"
                return $EC
              fi

              # 429 限流 / 5xx / 连接失败：丢弃当前模型，下一次循环重新探测（并跳过它）
              if tail -40 "$OUT" | grep -qiE "too many requests|rate.?limit|status.{0,3}429|FreeTierError|free tier|status.{0,3}5[0-9][0-9]|econnreset|etimedout|fetch failed|socket hang up|connection (refused|reset)"; then
                echo "[warn] phase=$phase 限流/5xx/连接失败（$SELECTED_MODEL），重新探测 provider (attempt=$attempt)"
                mark_broken "$SELECTED_PROVIDER"
                SELECTED_MODEL=""
                sleep 60
                continue
              fi

              # 其它非零退出：同样丢弃当前模型并重新探测，直到阶段预算或全局时间用尽
              echo "[warn] phase=$phase 调用失败 (exit=$EC, model=$SELECTED_MODEL)，重新探测 provider (attempt=$attempt)"
              mark_broken "$SELECTED_PROVIDER"
              SELECTED_MODEL=""
              sleep 60
            done
          }

          # ================= 单次调用内“先定位、再修复” =================
          # 不再单独占用 detect 预算：把“快速定位问题”并入同一次 opencode 调用，
          # 让修复拿满整个阶段预算，减少一次模型调用的固定开销。
          # 目标是在预算内尽可能多完成高价值改动，而不是只做一两个小改动。
          ISSUES_FILE=".opencode_issues.md"
          fast_prompt() {
            case "$1" in
              perf) printf '先用不超过 5-8 分钟快速扫描性能热点（可写入 `%s`，该临时清单不是报告），然后持续优化；在本阶段预算内尽可能多完成高价值、可验证的优化，不要只做 1-2 个就停，也不要为了赶时间提前结束。每个改动后运行自检；修复完成后删除该临时清单。每完成一个可验证的改动就立即 git commit（不要 push、不要 amend），避免阶段被超时中断时丢失进度。\n\n%s\n' "$ISSUES_FILE" "$2" ;;
              bug)  printf '先快速定位 bug（可把要点写入 `%s`，该临时清单不是报告），然后持续修复；在本阶段预算内尽可能多修复高价值、可验证的 bug，不要只修一个就停，也不要为了赶时间提前结束。每个修复后运行自检；修完删除该临时清单。每完成一个可验证的修复就立即 git commit（不要 push、不要 amend），避免阶段被超时中断时丢失进度。\n\n%s\n' "$ISSUES_FILE" "$2" ;;
            esac
          }

          # ================= 测试门（bug / sci / single 阶段提交后都执行）=================
          # 在写代码阶段（bug / sci）的 opencode 调用提交之后触发（调用点见主循环的
          # case "$phase" in bug|sci）。
          # 不再掷骰抽样——每次都跑一遍本仓库的测试；
          # 跑不通 → 调用 dsh 修复 → 修复结果按本仓库既有提交路径落到 main。
          maybe_run_tests() {
            local iter="$1"
            # 测试门 = 全量语法检查 + tests/ 下的快速回归（几十秒），
            # 每次提交后都跑，不再按比例抽样。
            echo "[test-gate] iter #$iter 执行全量测试"
            local TG_REMAIN=$(( DEADLINE - $(date +%s) ))
            if [ "$TG_REMAIN" -lt 1200 ]; then
              echo "[test-gate] 剩余时间不足 20 分钟，放弃本次测试"
              return 0
            fi
            cat > /tmp/tg_run.sh <<'TGEOF'
            set +e
            TG_FILES="$(git ls-files '*.py' 2>/dev/null)"
            [ -z "$TG_FILES" ] && exit 42
            python3 -m py_compile $TG_FILES || exit $?
            # 语法检查之外补一组快速回归（top-1 路由梯度、GQA、
            # B_early 等计算量、伪重复折叠、测试集账本等）。
            if [ -d tests ]; then
              python3 -m unittest discover -s tests -v
              exit $?
            fi
            exit 0
          TGEOF
            local TG_LOG=/tmp/test_gate.log
            echo "=========== TEST GATE (iter #$iter) ==========="
            timeout --kill-after=60 1500 bash /tmp/tg_run.sh > "$TG_LOG" 2>&1
            local TG_EC=$?
            tail -25 "$TG_LOG" 2>/dev/null || true
            if [ "$TG_EC" -eq 0 ]; then
              echo "[test-gate] 测试通过，无需修复"
              return 0
            fi
            if [ "$TG_EC" -eq 42 ]; then
              echo "[test-gate] 本仓库没有可识别的测试，跳过"
              return 0
            fi
            if [ "$TG_EC" -eq 43 ]; then
              echo "[test-gate] 测试依赖环境不可用（安装失败），跳过修复"
              return 0
            fi
            if [ "$TG_EC" -eq 124 ] || [ "$TG_EC" -eq 137 ] || [ "$TG_EC" -eq 143 ]; then
              echo "[test-gate] 测试超时/被中断 (exit=$TG_EC)，结果不确定，本轮不修复"
              return 0
            fi
            echo "[test-gate] 测试未通过 (exit=$TG_EC)，调用 dsh 修复"
            local TG_FIX_BUDGET=$(( DEADLINE - $(date +%s) - 900 ))
            if [ "$TG_FIX_BUDGET" -lt 900 ]; then
              echo "[test-gate] 剩余时间不足以安排修复，仅记录失败"
              return 0
            fi
            if [ "$TG_FIX_BUDGET" -gt 10800 ]; then TG_FIX_BUDGET=10800; fi
            {
              echo '本仓库的测试跑不通，请修复。复现方式：在仓库根目录运行 bash /tmp/tg_run.sh。'
              echo
              echo '失败日志（最后 80 行）：'
              tail -80 "$TG_LOG" 2>/dev/null
              echo
              echo '要求：'
              echo '1. 只修复导致测试失败的问题，不得削弱、跳过或删除测试，不得修改门禁脚本让断言失效；'
              echo '2. 不要借修复之名重写无关代码，保持原有功能语义不变；'
              echo '3. .github 目录是 CI 配置，绝对不要删除、修改或移动其中任何文件；'
              echo '4. 修复后必须自行运行测试并确认完全通过。'
            } > /tmp/tg_fix_prompt.txt
            run_phase "testfix" "$(cat /tmp/tg_fix_prompt.txt)" "$TG_FIX_BUDGET" || true


            timeout --kill-after=30 600 bash /tmp/tg_run.sh > /tmp/test_gate_verify.log 2>&1
            local TG_VEC=$?
            if [ "$TG_VEC" -eq 0 ]; then
              echo "[test-gate] 修复后复跑测试：通过"
            else
              echo "[test-gate] 修复后复跑测试仍未通过 (exit=$TG_VEC)"
            fi

            commit_and_push "$iter-testfix"

            return 0
          }

          # ================= 主循环 =================
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            i=$((i+1))

            AVAIL_MB=$(( $(df --output=avail / | tail -1) / 1024 ))
            echo "--- iteration #$i | free disk: ${AVAIL_MB}MB ---"
            free -h | head -2
            if [ "$AVAIL_MB" -lt 2048 ]; then
              echo "[error] 磁盘剩余不足 2GB，提前结束循环，交给收尾步骤清理"
              break
            fi

            # ----- 阶段：perf 与 clean 已停用 → bug -> sci -> single -> apply（clean 的清理工作交给收尾的 shell 步骤）-----
            # for phase in perf bug sci single clean apply; do
            for phase in bug sci single apply; do
              case "$phase" in
                perf)  P="$PROMPT_PERF";  T="$PERF_TIMEOUT"  ;;
                bug)   P="$PROMPT_BUG";   T="$BUG_TIMEOUT"   ;;
                sci)
                  # 科研方法改进：从 PROMPT_SCI_1~6 中随机选一个提示词
                  SCI_ROLL=$(( (RANDOM % 6) + 1 ))
                  case "$SCI_ROLL" in
                    1) P="$PROMPT_SCI_1"; SCI_LABEL='通用（不指定方面）' ;;
                    2) P="$PROMPT_SCI_2"; SCI_LABEL='实验设计与准备' ;;
                    3) P="$PROMPT_SCI_3"; SCI_LABEL='数据处理' ;;
                    4) P="$PROMPT_SCI_4"; SCI_LABEL='可复现性与工程规范' ;;
                    5) P="$PROMPT_SCI_5"; SCI_LABEL='对比实验与消融' ;;
                    6) P="$PROMPT_SCI_6"; SCI_LABEL='结果分析' ;;
                  esac
                  T="$SCI_TIMEOUT"
                  echo "[info] sci 阶段随机选中科研方法提示词 #$SCI_ROLL：$SCI_LABEL"
                ;;
                clean) P="$PROMPT_CLEAN"; T="$CLEAN_TIMEOUT" ;;
                single) P="$PROMPT_SINGLE"; T="$SINGLE_TIMEOUT" ;;
                apply) P="$PROMPT_APPLY"; T="$APPLY_TIMEOUT" ;;
              esac

              # 收窄到剩余时间
              REMAIN=$(( DEADLINE - $(date +%s) ))
              if [ "$REMAIN" -le 0 ]; then
                echo "[info] 全局时间已到，退出循环"
                break 2
              fi
              if [ "$T" -gt "$REMAIN" ]; then T="$REMAIN"; fi

              echo ">>> iteration #$i | phase=$phase | budget=${T}s"
              case "$phase" in
                perf|bug) P="$(fast_prompt "$phase" "$P")" ;;
              esac
              run_phase "$phase" "$P" "$T"

              # 无论成功失败，先把已完成的改动提交上去
              commit_and_push "$i-$phase"

              # ⭐ 测试门：bug / sci / single 阶段提交后都跑一遍全量测试，详见 maybe_run_tests
              case "$phase" in
                bug|sci|single) maybe_run_tests "$i" ;;
              esac

              sleep 5
            done
          done

      - name: Cleanup repo artifacts
        if: always()
        run: |
          set +e
          # 只清理临时文件；实验结果/审计/分析记录必须保留或
          # 由独立的 artifact 步骤归档，不能在这里删除。
          rm -f .opencode_issues.md
          rm -f opencode.json opencode.jsonc .opencode.json 2>/dev/null
          find . -maxdepth 2 -type f \( -name '*.tmp' -o -name '*.bak' \) -not -path './.git/*' -delete

      - name: Final commit and push
        if: always()
        run: |
          set +e
          git checkout HEAD -- .github 2>/dev/null || true
          git clean -fdq .github 2>/dev/null || true
          # 防删自愈：收尾提交前恢复被删的 README.md
          if [ ! -f "README.md" ]; then
            if git show HEAD:README.md > /tmp/readme_restore.md 2>/dev/null && [ -s /tmp/readme_restore.md ]; then
              mv /tmp/readme_restore.md README.md
            else
              README_SHA=$(git log --format=%H --diff-filter=AM -- README.md 2>/dev/null | head -1)
              if [ -n "$README_SHA" ] && git show "${README_SHA}:README.md" > /tmp/readme_restore2.md 2>/dev/null && [ -s /tmp/readme_restore2.md ]; then
                mv /tmp/readme_restore2.md README.md
              fi
            fi
            [ -f README.md ] && echo "[guard] 收尾阶段发现 README.md 被删，已恢复"
          fi
          git add -A
          LAST_MODEL="$(head -c 120 /tmp/last_model_used.txt 2>/dev/null || true)"
          git commit -m "auto: end of 5h run, cleanup${LAST_MODEL:+ [model: $LAST_MODEL]}" || echo "nothing to commit"
          BRANCH="${GITHUB_REF_NAME:-main}"
          git pull --rebase origin "$BRANCH" || git rebase --abort || true
          git push origin "HEAD:${BRANCH}" || echo "[warn] final push failed"

      - name: Archive run artifacts (audit trail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smelt-isr-run-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 90
          path: |
            runs/**
            **/config.json
            **/metrics.jsonl
            **/comparison_analysis.json
            **/routing*.json
            /tmp/oc_out.log

      - name: Push to Gitee
        if: always()
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          set +e
          if [ -z "$GITEE_TOKEN" ] || [ -z "$GITEE_REPO" ]; then
            echo "GITEE_TOKEN or GITEE_REPO not set, skipping Gitee push."
            exit 0
          fi
          BRANCH="${GITHUB_REF_NAME:-main}"
          git remote remove gitee 2>/dev/null || true
          git remote add gitee "https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"
          git push gitee "HEAD:${BRANCH}" --force || echo "[warn] push to Gitee failed"
  # ===== loop hand-off (added) =====

  # ⭐ 立刻续跑（下）：独立的收尾 job。
  # needs + if: always()：工作 job 无论成功、失败、超时被取消，这个 job 都会紧接着启动（已实测验证）。
  # 这里无条件派发一个新的后继 run：它在组内排队，本 run 退出的一瞬间就被调度。
  # 万一这个 job 连启动都没机会（整个 run 被强杀），*/15 心跳会兜底。
  next-run:
    needs: [run-opencode]
    if: always() && vars.EXPERIMENT_FREEZE != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Ensure next run is queued
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          BRANCH="${GITHUB_REF_NAME}"
          WF_REF="${GITHUB_WORKFLOW_REF%%@*}"
          WF_FILE="${WF_REF##*/}"
          case "$WF_FILE" in
            *.yml|*.yaml) ;;
            *) WF_FILE="continuous-loop.yml" ;;
          esac
          echo "[loop] repo=${GH_REPO} workflow=${WF_FILE} branch=${BRANCH} run=${RUN_ID}"
          for attempt in 1 2 3 4 5; do
            if gh workflow run "$WF_FILE" --ref "$BRANCH"; then
              echo "[loop] 已派发后继 run（attempt ${attempt}）——本 run 结束后立刻起跑"
              exit 0
            fi
            echo "[loop][warn] 派发失败（attempt ${attempt}）10s 后重试"
            sleep 10
          done
          echo "[loop][warn] 派发失败；下一次 */15 心跳会补位"
          exit 0
